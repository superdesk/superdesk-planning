name: "CI-E2E"

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
        node-version: ['22']
        shardIndex: [1, 2]
        shardTotal: [2]
    env:
      INSTALL_NODE_MODULES: false
      RUN_SERVICES: true
      E2E: true
      TZ: Australia/Sydney
      # CI runs the server on 5000 (hypercorn default; no AirPlay conflict on
      # Linux). The test helpers and client build read SUPERDESK_URL, which
      # defaults to 5002 locally to dodge macOS AirPlay; pin it to the CI port.
      SUPERDESK_URL: http://localhost:5000/api
    defaults:
      run:
        working-directory: ./e2e
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            server/requirements.txt
            e2e/server/requirements.txt
            e2e/server/core-requirements.txt
      - name: Setup Environment
        run: ./scripts/ci-install.sh
        working-directory: ./
      - name: Install Planning Client
        run: npm ci
        working-directory: ./
      - name: Install E2E Client
        run: npm install
      - name: Build Client
        run: npm run build
      - name: Start Services
        run: ./scripts/ci-start-services.sh
        working-directory: ./
      - name: Start web server
        run: npm run start-client-server

      # playwright start
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run playwright -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ matrix.node-version }}-${{ matrix.shardIndex }}
          path: e2e/test-results
      # playwright end
