name: "CI-E2E"

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
        node-version: ['22']
        shardIndex: [1, 2]
        shardTotal: [2]
    env:
      INSTALL_NODE_MODULES: false
      RUN_SERVICES: true
      E2E: true
      TZ: Australia/Sydney
      # CI runs the server on 5000 (hypercorn default; no AirPlay conflict on
      # Linux). The test helpers and client build read SUPERDESK_URL, which
      # defaults to 5002 locally to dodge macOS AirPlay; pin it to the CI port.
      SUPERDESK_URL: http://localhost:5000/api
    defaults:
      run:
        working-directory: ./e2e
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            server/requirements.txt
            e2e/server/requirements.txt
            e2e/server/core-requirements.txt
      - name: Setup Environment
        run: ./scripts/ci-install.sh
        working-directory: ./
      - name: Install Planning Client
        run: npm ci
        working-directory: ./
      - name: Install E2E Client
        run: npm install
      - name: Build Client
        run: npm run build
      - name: Start Services
        run: ./scripts/ci-start-services.sh
        working-directory: ./
      - name: Start web server
        run: npm run start-client-server

      # playwright start
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # `--with-deps` runs apt-get, which hangs for the full job timeout when a
      # mirror stalls or a package prompts; the env vars keep it non-interactive
      # and the timeout turns a stall into a fast failure instead of a 6h job
      - name: Install Playwright browsers and system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npm run playwright -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ matrix.node-version }}-${{ matrix.shardIndex }}
          path: e2e/test-results
      # playwright end
