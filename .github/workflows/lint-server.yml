name: "Lint-Server"

on: [push, pull_request]

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'server/*requirements.txt'
    - run: pip install -Ur server/requirements.txt
    - run: black --check server

  flake8:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'server/*requirements.txt'
    - run: pip install -Ur server/requirements.txt
    - run: flake8 server

  mypy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'server/*requirements.txt'
    - run: pip install -Ur server/requirements.txt
    - run: mypy server
